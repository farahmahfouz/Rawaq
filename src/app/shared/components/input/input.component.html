<div class="flex items-center justify-between mb-1.5">
    <label class="text-textTertiary font-normal">{{ label() }}</label>

    @if (forgot()) {
    <a class="text-xs font-semibold text-primary-dark hover:underline">
        Forgot password?
    </a>
    }
</div>


<div class="relative">
    @if (showIcon()) {
    <span class="absolute inset-y-0 inset-s-3 flex items-center pointer-events-none text-textSecondary">
        <svg [icon]="icon()" class="size-5"></svg>
    </span>
    }

    <input [type]="inputType()" [placeholder]="placeholder()" [value]="value()" [disabled]="disabled()"
        (input)="updateValue($event)" (blur)="onTouched()" [class]="classes()" [class.pe-11]="type() === 'password'" />

    @if (type() === 'password') {
    <button type="button" (click)="toggle()" [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
        class="absolute inset-y-0 inset-e-3 flex items-center text-textTertiary">
        @if (visible()) {
        <svg icon="hidePassword" class="size-5 text-textSecondary"></svg>
        } @else {
        <svg icon="showPassword" class="size-6 text-textSecondary"></svg>
        }
    </button>
    }
    @if(errorMessage()){
    <div class="flex gap-1 items-center pt-1">
        <svg icon="required" class="text-error size-3"></svg>
        <small class="text-error">{{errorMessage()}}</small>
    </div>
    }
</div>
